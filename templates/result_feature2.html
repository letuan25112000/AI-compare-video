<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <title>解析結果 - AI映像検出</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>

<body>
  <div class="container">
    <h3>解析結果の動画</h3>
    {% for video in video_paths %}
    <div class="video-item">
      <p>{{ video.split('/')[-1] }}</p>
      <video width="480" controls>
        <source src="{{ url_for('static', filename=video.split('static/')[-1]) }}" type="video/mp4">
        Your browser does not support the video tag.
      </video>
    </div>
    {% endfor %}
    <br>

    <a href="{{ url_for('download', filename=excel_file) }}" class="btn">結果Excelをダウンロード</a>

    <a href="{{ url_for('index') }}" class="btn">戻る</a>
  </div>
</body>

</html>
