<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <title>解析結果 - AI映像検出</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  <style>
    .container {
      min-width: 100%;
    }

    .box-video {
      width: 100%;
      position: relative;
      display: flex;
      gap: 10px;
    }

    .org-video {
      width: 50% !important;
      position: sticky;
      top: 10px;
      height: fit-content;
    }

    .compare-video {
      width: 50%;
      padding-top: 8px;
    }

    .video-item {
      width: 100%;
      margin: 20px 0;
      display: inline-block;
      text-align: center;
    }

    .video-item.master {
      padding: 5px;
      border: 3px solid transparent;
      border-color: #00bcd4;
      box-shadow: 0 0 15px rgba(0, 178, 187, 0.6);
    }

    video {
      width: 100%;
      display: block;
      margin: 0 auto;
    }

    .set-master-btn {
      margin-top: 5px;
      background-color: #c80025;
    }

    .set-master-btn:hover {
      background: #a3001e;
    }

    .box-button {
      margin: 20px 0;
    }
  </style>
</head>

<body>
  <div class="container">
    <h3>解析結果の動画一覧</h3>

    <div class="box-button">
      <a href="{{ url_for('download', filename=excel_file) }}" class="btn">解析結果（Excel）をダウンロード</a>
      <a href="{{ url_for('index') }}" class="btn">トップへ戻る</a>
    </div>
    <hr>

    <div class="box-video">
      <div class="video-item org-video">
        <p>{{ org_path.split('/')[-1] }}</p>
        <video width="480" controls preload="metadata">
          <source src="{{ url_for('static', filename=org_path.split('static/')[-1]) }}" type="video/mp4">
          このブラウザは video タグをサポートしていません。
        </video>
      </div>
      <div class="compare-video">
        {% for video in video_paths %} <div class="video-item">
          <p>{{ video.split('/')[-1] }}</p>
          <video width="480" controls preload="metadata">
            <source src="{{ url_for('static', filename=video.split('static/')[-1]) }}" type="video/mp4">
            このブラウザは video タグをサポートしていません。
          </video>
        </div>
        {% endfor %}

      </div>

    </div>

  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const videoItems = document.querySelectorAll(".video-item");
      const videos = document.querySelectorAll("video");
      if (videos.length === 0) return;

      let master = videos[0];
      let masterItem = videoItems[0];
      masterItem.classList.add("master");

      function setMaster(newMaster) {
        master = newMaster;

        videoItems.forEach(item => item.classList.remove("master"));
        const parentItem = newMaster.closest(".video-item");
        parentItem.classList.add("master");

        console.log("🟢 メイン動画を変更:", newMaster.querySelector("source").src);
      }

      function bindSyncEvents() {
        // 古いイベントを削除
        videos.forEach(v => v.onplay = v.onpause = v.onseeked = v.ontimeupdate = null);

        master.onplay = () => {
          videos.forEach(v => {
            if (v !== master) {
              v.currentTime = master.currentTime;
              if (v.paused) v.play().catch(() => { });
            }
          });
        };

        master.onpause = () => {
          videos.forEach(v => {
            if (v !== master && !v.paused) v.pause();
          });
        };

        master.onseeked = () => {
          videos.forEach(v => {
            if (v !== master) v.currentTime = master.currentTime;
          });
        };

        // 同期頻度を減らす：0.3秒ごと、かつ再生中のみ
        let lastSync = 0;
        master.ontimeupdate = () => {
          const now = performance.now();
          if (now - lastSync < 300) return; // 0.3秒に1回
          lastSync = now;

          if (!master.paused) {
            videos.forEach(v => {
              if (v !== master && Math.abs(v.currentTime - master.currentTime) > 0.3) {
                v.currentTime = master.currentTime;
              }
            });
          }
        };
      }

      bindSyncEvents();

      // 「メイン動画に設定」ボタンの処理
      videoItems.forEach(item => {
        const video = item.querySelector("video");

        video.addEventListener("click", () => {
          if (video === master) {
            // masterなら再生/停止切り替え
            if (video.paused) {
              video.pause();
            } else {
              video.play();
            }
          } else {
            setMaster(video);
            bindSyncEvents();
          }
        });
      });
    });
  </script>

</body>

</html>
