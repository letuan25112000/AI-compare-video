<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>解析結果 - AI映像検出</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
  <div class="app-container result-page">
    <!-- Header -->
    <header class="app-header">
      <div class="header-content">
        <div class="logo-section">
          <div class="logo-icon">
            <i class="fas fa-video"></i>
          </div>
          <div class="logo-text">
            <h1 class="app-title">解析結果</h1>
            <p class="app-subtitle">動画比較分析結果</p>
          </div>
        </div>
        <form action="/shutdown" method="post" class="form-exit">
          <button type="submit" class="exit-btn">
            <i class="fas fa-power-off"></i>
            <span>終了</span>
          </button>
        </form>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
      <div class="result-header">
        <div class="success-message">
          <div class="success-icon">
            <i class="fas fa-check-circle"></i>
          </div>
          <div class="message-content">
            <h2>動画解析が完了しました</h2>
            <p>AIによる動画比較分析の結果をご確認ください</p>
          </div>
        </div>
      </div>

      <div class="action-bar">
        <a href="{{ url_for('download', filename=excel_file) }}" class="action-btn primary-btn">
          <i class="fas fa-file-excel"></i>
          解析結果（Excel）をダウンロード
        </a>
        <a href="{{ url_for('diff_frames') }}" class="action-btn primary-btn btn-frame">
          <i class="fas fa-columns"></i>
          差分フレームを表示
        </a>
        <a href="{{ url_for('index') }}" class="action-btn secondary-btn">
          <i class="fas fa-home"></i>
          トップへ戻る
        </a>
      </div>

      <div class="video-comparison-section">
        <h3 class="section-title">
          <i class="fas fa-play-circle"></i>
          解析結果の動画一覧
        </h3>
        
        <div class="box-video">
          <div class="video-item org-video master">
            <div class="video-header">
              <h4>{{ org_path.split('/')[-1] }}</h4>
              <div class="video-badge">メイン</div>
            </div>
            <video width="480" controls preload="metadata">
              <source src="{{ url_for('results_file', filename=org_path.split('results/')[-1]) }}" type="video/mp4">
              このブラウザは video タグをサポートしていません。
            </video>
            <div class="video-instruction">
              <i class="fas fa-mouse-pointer"></i>
              クリックで再生/一時停止
            </div>
          </div>
          <div class="compare-video">
            {% for video in video_paths %}
            <div class="video-item compare">
              <div class="video-header">
                <h4>{{ video.split('/')[-1] }}</h4>
                <div class="video-instruction">
                  <i class="fas fa-hand-pointer"></i>
                  クリックでメイン動画に設定
                </div>
              </div>
              <video width="480" controls preload="metadata">
                <source src="{{ url_for('results_file', filename=video.split('results/')[-1]) }}" type="video/mp4">
                このブラウザは video タグをサポートしていません。
              </video>
            </div>
            {% endfor %}
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const videoItems = document.querySelectorAll(".video-item");
      const videos = document.querySelectorAll("video");
      if (videos.length === 0) return;

      let master = videos[0];
      let masterItem = videoItems[0];
      masterItem.classList.add("master-active");

      function setMaster(newMaster) {
        master = newMaster;

        videoItems.forEach(item => item.classList.remove("master-active"));
        const parentItem = newMaster.closest(".video-item");
        parentItem.classList.add("master-active");

        console.log("メイン動画を変更:", newMaster.querySelector("source").src);
      }

      function bindSyncEvents() {
        // 古いイベントを削除
        videos.forEach(v => v.onplay = v.onpause = v.onseeked = v.ontimeupdate = null);

        master.onplay = () => {
          videos.forEach(v => {
            if (v !== master) {
              v.currentTime = master.currentTime;
              if (v.paused) v.play().catch(() => { });
            }
          });
        };

        master.onpause = () => {
          videos.forEach(v => {
            if (v !== master && !v.paused) v.pause();
          });
        };

        master.onseeked = () => {
          videos.forEach(v => {
            if (v !== master) v.currentTime = master.currentTime;
          });
        };

        // 同期頻度を減らす：0.3秒ごと、かつ再生中のみ
        let lastSync = 0;
        master.ontimeupdate = () => {
          const now = performance.now();
          if (now - lastSync < 300) return; // 0.3秒に1回
          lastSync = now;

          if (!master.paused) {
            videos.forEach(v => {
              if (v !== master && Math.abs(v.currentTime - master.currentTime) > 0.3) {
                v.currentTime = master.currentTime;
              }
            });
          }
        };
      }

      bindSyncEvents();

      // 「メイン動画に設定」ボタンの処理
      videoItems.forEach(item => {
        const video = item.querySelector("video");

        video.addEventListener("click", () => {
          if (video === master) {
            // masterなら再生/停止切り替え
            if (video.paused) {
              video.play();
            } else {
              video.pause();
            }
          } else {
            setMaster(video);
            bindSyncEvents();
          }
        });
      });
    });
  </script>
</body>
</html>
