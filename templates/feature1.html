<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <title>AI検出 - 動画異常検知</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  <style></style>
</head>

<body>
  <div class="container">
    <h1>機能➀ 複数の動画比較</h1>
    <form id="uploadForm" action="/feature2" method="POST" enctype="multipart/form-data">
      <label>元動画:</label>
      <input type="file" name="video1" accept="video/*" required />

      <label>比較動画:</label>
      <input type="file" name="videos" accept="video/*" multiple required />

      <button type="submit">AIで動画を解析</button>
    </form>
  </div>

  <div id="loading" class="loading-overlay">
    <div style="display: flex; align-items: center">
      <div class="spinner"></div>
      AIで動画を処理中です。少々お待ちください...
    </div>
  </div>

  <script>
    const form = document.getElementById("uploadForm");
    const loading = document.getElementById("loading");
    form.addEventListener("submit", () => {
      loading.style.display = "flex";
    });
  </script>
</body>

</html>
